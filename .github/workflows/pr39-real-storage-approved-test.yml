name: PR39 real Storage approved test

on:
  push:
    branches:
      - feature/pr39-document-upload-rescue

jobs:
  real-storage-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Execute approved PR39 real Storage probe
        shell: bash
        run: |
          set -euo pipefail
          URL='https://eccomi-noleggio-pr-39.onrender.com/api/internal/pr39-real-storage-test?token=pr39-real-storage-20261006-approved-8f2c7a41d9e6'
          BODY_FILE="${RUNNER_TEMP}/pr39-body.json"
          STATUS="$(curl -sS --max-time 180 -o "${BODY_FILE}" -w '%{http_code}' "${URL}")"
          echo "HTTP_STATUS=${STATUS}"
          cat "${BODY_FILE}"
          echo
          export BODY_FILE STATUS
          python3 - <<'PY'
          import json, os, sys
          status = int(os.environ["STATUS"])
          with open(os.environ["BODY_FILE"], "r", encoding="utf-8") as fh:
              payload = json.load(fh)
          print("RESULT=", payload.get("result"))
          print("BYPASS_413=", payload.get("bypass413Verified"))
          print("METADATA=", payload.get("metadataVerified"))
          print("RETRY_IDEMPOTENT=", payload.get("retryWasIdempotent"))
          print("CLEANUP=", payload.get("cleanupVerified"))
          if status != 200:
              raise SystemExit(f"unexpected HTTP status {status}")
          required = [
              payload.get("result") == "PASS",
              payload.get("bypass413Verified") is True,
              payload.get("metadataVerified") is True,
              payload.get("retryWasIdempotent") is True,
              payload.get("cleanupVerified") is True,
          ]
          if not all(required):
              raise SystemExit("PR39 real Storage assertions failed")
          PY
